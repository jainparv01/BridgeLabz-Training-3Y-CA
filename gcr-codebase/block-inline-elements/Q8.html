<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>

<body>

    <h1>ABC Public School</h1>

    <h2>Student Report</h2>

    <table border="1">

        <tr>
            <th rowspan="2">Student Name</th>
            <th colspan="5">Subject Marks</th>
            <th rowspan="2">Result</th>
        </tr>

        <tr>
            <th title="English marks">English</th>
            <th title="Mathematics marks">Maths</th>
            <th title="Science marks">Science</th>
            <th title="Computer marks">Computer</th>
            <th title="Social Science marks">Social Science</th>
        </tr>

        <tr>
            <td>Parv Jain</td>
            <td>85</td>
            <td>90</td>
            <td>88</td>
            <td>95</td>
            <td>82</td>
            <td>Pass</td>
        </tr>

        <tr>
            <th colspan="5">Total</th>
            <td colspan="2">440</td>
        </tr>

        <tr>
            <th colspan="5">Percentage</th>
            <td colspan="2">88%</td>
        </tr>

    </table>

</body>
</html>
