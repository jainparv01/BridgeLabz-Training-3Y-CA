<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>

<body>

    <h1>Travel Selection</h1>

    <label for="country">Country:</label>

    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>France</option>
        <option>Japan</option>
    </select>

    <br><br>

    <label for="state">State:</label>

    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Goa</option>
    </select>

    <br><br>

    <label for="city">City:</label>

    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Lucknow</option>
        <option>Varanasi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>

    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Gateway of India</option>
        <option>Jaipur City Palace</option>
        <option>Goa Beaches</option>
    </select>

    <br><br>

    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Mathura, and my favorite tourist place is the Taj Mahal.
    </p>

</body>
</html>
