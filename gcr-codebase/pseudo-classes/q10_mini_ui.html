<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface</title>
  <link rel="stylesheet" href="q10_mini_ui.css">
</head>
<body>
  <header><h1>Mini User Interface</h1></header>
  <main>
    <section class="card">
      <div class="content">
        <div>
          <h2>Create Your Profile</h2>
          <p>Enter your details to create a simple profile.</p>
          <form>
            <label for="name">Name</label><input id="name" type="text" placeholder="Your name">
            <label for="email">Email</label><input id="email" type="email" placeholder="you@example.com">
            <div class="buttons"><button type="submit">Submit</button><button type="reset" class="reset">Reset</button></div>
          </form>
        </div>
        <img src="https://picsum.photos/id/64/300/220" alt="Profile workspace">
      </div>
    </section>
  </main>
  <footer><p>Responsive mini UI built with semantic HTML5 and Flexbox.</p></footer>
</body>
</html>
