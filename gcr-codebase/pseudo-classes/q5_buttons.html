<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Collection</title>
  <link rel="stylesheet" href="q5_buttons.css">
</head>
<body>
  <header><h1>Styled Button Collection</h1></header>
  <main class="buttons">
    <button class="primary">Primary</button>
    <button class="secondary">Secondary</button>
    <button class="outline">Outline</button>
    <button class="disabled" disabled>Disabled</button>
  </main>
  <footer><p>Focus and disabled states are demonstrated with CSS pseudo-classes.</p></footer>
</body>
</html>
