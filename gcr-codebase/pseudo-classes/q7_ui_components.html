<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components</title>
  <link rel="stylesheet" href="q7_ui_components.css">
</head>
<body>
  <header><h1>Simple UI Components</h1></header>
  <main class="card">
    <label for="search">Search</label>
    <input id="search" type="search" placeholder="Search here...">
    <div class="actions"><button>Search</button><button class="secondary">Cancel</button></div>
    <label for="topic">Choose a topic</label>
    <select id="topic"><option>Web Development</option><option>CSS</option><option>HTML</option><option>Design</option></select>
  </main>
</body>
</html>
