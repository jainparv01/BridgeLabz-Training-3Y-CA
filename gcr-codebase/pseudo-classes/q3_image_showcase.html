<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="q3_image_showcase.css">
</head>
<body>
  <header><h1>Image Showcase</h1><p>Hover over an image to see the effect.</p></header>
  <main class="gallery">
    <figure><div class="photo"><img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape"></div><figcaption>Mountain Escape</figcaption></figure>
    <figure><div class="photo"><img src="https://picsum.photos/id/1011/600/400" alt="River and mountains"></div><figcaption>River Valley</figcaption></figure>
    <figure><div class="photo"><img src="https://picsum.photos/id/1025/600/400" alt="Dog portrait"></div><figcaption>Friendly Companion</figcaption></figure>
    <figure><div class="photo"><img src="https://picsum.photos/id/1043/600/400" alt="Beach landscape"></div><figcaption>Coastal View</figcaption></figure>
    <figure><div class="photo"><img src="https://picsum.photos/id/1069/600/400" alt="Forest landscape"></div><figcaption>Green Forest</figcaption></figure>
    <figure><div class="photo"><img src="https://picsum.photos/id/1039/600/400" alt="Bridge landscape"></div><figcaption>Quiet Bridge</figcaption></figure>
  </main>
</body>
</html>
