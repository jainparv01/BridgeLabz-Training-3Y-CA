<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltips</title>
  <link rel="stylesheet" href="q2_tooltips.css">
</head>
<body>
  <header><h1>Tooltip Demonstration</h1></header>
  <main class="tooltip-container">
    <section class="tooltip-item"><span class="icon">★</span><span class="tooltip">Favorite item</span></section>
    <section class="tooltip-item"><span class="icon">?</span><span class="tooltip">Help and information</span></section>
    <section class="tooltip-item"><span class="icon">i</span><span class="tooltip">More details</span></section>
    <section class="tooltip-item"><span class="icon">✓</span><span class="tooltip">Completed successfully</span></section>
  </main>
  <footer><p>Tooltips are created with CSS only.</p></footer>
</body>
</html>
