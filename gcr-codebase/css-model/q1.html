<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header><h1>Borders & Padding</h1></header>
  <main>
    <section class="boxes">
      <div class="box solid">Solid Border<br><span>Padding: 15px</span></div>
      <div class="box dashed">Dashed Border<br><span>Padding: 25px</span></div>
      <div class="box double">Double Border<br><span>Padding: 35px</span></div>
      <div class="box groove">Groove Border<br><span>Rounded corners</span></div>
    </section>
  </main>
  <footer>Hover over a box to change its border color.</footer>
</body>
</html>
