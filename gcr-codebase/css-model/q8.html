<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Exploration</title><link rel="stylesheet" href="q8.css">
</head>
<body>
  <main>
    <h1>CSS Box Model</h1>
    <div class="demo">
      <div class="margin">
        <div class="border">
          <div class="padding">
            <div class="content">CONTENT<br><small>Content area</small></div>
          </div>
        </div>
      </div>
    </div>
    <p><strong>Content:</strong> actual text or element content.</p>
    <p><strong>Padding:</strong> space between content and border.</p>
    <p><strong>Border:</strong> edge surrounding padding and content.</p>
    <p><strong>Margin:</strong> outer space around the element.</p>
    <p>Below, <code>box-sizing: border-box</code> keeps padding and border inside the declared size.</p>
  </main>
</body>
</html>
