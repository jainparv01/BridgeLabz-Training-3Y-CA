<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced CSS Selectors</title><link rel="stylesheet" href="q5.css">
</head>
<body>
  <main>
    <h1>Advanced CSS Selectors</h1>
    <section class="panel">
      <input type="text" placeholder="Text input">
      <input type="email" placeholder="Email input">
      <p class="note">First paragraph</p>
      <p>Second paragraph</p>
      <ul>
        <li>Item One</li><li>Item Two</li><li>Item Three</li><li>Item Four</li>
      </ul>
      <a href="https://example.com">Secure HTTPS link</a>
      <a href="http://example.com">Regular link</a>
    </section>
  </main>
</body>
</html>
