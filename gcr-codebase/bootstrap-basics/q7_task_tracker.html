<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Task Tracker</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="q7_task_tracker.css"></head>
<body class="bg-light"><header class="bg-white border-bottom py-4"><div class="container d-flex justify-content-between align-items-center"><div><h1 class="h3 mb-1">TaskFlow</h1><p class="text-secondary mb-0">Your daily task manager</p></div><span class="badge text-bg-danger fs-6">4 pending</span></div></header>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm border-0"><div class="card-body p-0"><div class="p-4 border-bottom"><h2 class="h4 mb-0">Today's Tasks</h2></div><div class="list-group list-group-flush">
<div class="list-group-item d-flex justify-content-between align-items-center p-4"><span>Finish Bootstrap assignment</span><span class="badge text-bg-danger">High</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center p-4"><span>Review Java notes</span><span class="badge text-bg-warning">Medium</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center p-4"><span>Push project to GitHub</span><span class="badge text-bg-danger">High</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center p-4"><span>Read documentation</span><span class="badge text-bg-secondary">Low</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center p-4"><span>Plan tomorrow's schedule</span><span class="badge text-bg-warning">Medium</span></div>
</div><div class="p-4 border-top"><button class="btn btn-success">Completed <span class="badge text-bg-light text-success ms-1">3</span></button></div></div></div></div></div></main>
<footer class="text-center py-4 text-secondary">Stay focused. Finish what matters.</footer></body></html>
