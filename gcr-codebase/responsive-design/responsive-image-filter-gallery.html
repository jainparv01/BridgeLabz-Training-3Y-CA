<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
    <header class="site-header"><h1>Filter Gallery</h1></header>
    <main>
        <section class="gallery" aria-label="Image filter gallery">
            <figure><img class="blur" src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape"><figcaption>Blur</figcaption></figure>
            <figure><img class="grayscale" src="https://picsum.photos/id/1016/600/400" alt="Forest landscape"><figcaption>Grayscale</figcaption></figure>
            <figure><img class="sepia" src="https://picsum.photos/id/1025/600/400" alt="Dog portrait"><figcaption>Sepia</figcaption></figure>
            <figure><img class="brightness" src="https://picsum.photos/id/1035/600/400" alt="River landscape"><figcaption>Brightness</figcaption></figure>
            <figure><img class="contrast" src="https://picsum.photos/id/1043/600/400" alt="Ocean landscape"><figcaption>Contrast</figcaption></figure>
            <figure><img class="hue" src="https://picsum.photos/id/1069/600/400" alt="Nature scene"><figcaption>Hue Rotate</figcaption></figure>
        </section>
    </main>
    <footer><p>Responsive CSS Assignment</p></footer>
</body>
</html>
