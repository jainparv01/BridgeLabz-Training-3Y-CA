<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Strong and em Tag </title>
</head>
<body>
<p>My favorite hobby is <strong>coding</strong>. I <b> enjoy</b> learning new programming concepts and creating small projects in my free time. <br>
    Coding helps me improve my problem-solving skills and makes me feel <em>creative</em>. It is both fun and useful for my future career.</p>
</body>
</html>
