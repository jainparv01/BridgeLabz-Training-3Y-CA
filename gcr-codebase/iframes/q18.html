<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Quotations</title>
</head>
<body>
    <h2>Quotation Example</h2>

    <blockquote>
        Learning is a continuous process. Knowledge &amp; practice together
        help a person improve skills and solve problems effectively.
    </blockquote>

    <p>
        My favorite short quote is
        <q>Practice makes progress.</q>
    </p>
</body>
</html>
