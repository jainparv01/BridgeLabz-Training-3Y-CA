<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Defines the title shown on the browser tab. -->
    <title>Important Head Elements</title>

    <!-- Defines the character encoding used by the webpage. -->
    <meta charset="UTF-8">

    <!-- Provides a short description of the webpage. -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements">

    <!-- Defines the author of the webpage. -->
    <meta name="author" content="Parv Jain">

    <!-- Sets the base URL used by relative links on the page. -->
    <base href="https://example.com/">

    <!-- Links an external resource such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- Used to write internal CSS. It is empty here as required. -->
    <style>
    </style>

    <!-- Used to include or write JavaScript. It is empty here as required. -->
    <script>
    </script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates the important elements used inside the head section.</p>
</body>
</html>
