<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>

<frameset rows="25%,75%">
    <!-- Top frame contains navigation links -->
    <frame src="navigation.html" name="navigation">

    <!-- Bottom frame contains welcome message -->
    <frame src="welcome.html" name="content">

    <noframes>
        <body>
            <p>Your browser does not support frames.</p>
        </body>
    </noframes>
</frameset>
</html>
