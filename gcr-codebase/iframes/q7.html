<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>
    <h2>Login Form</h2>

    <form action="#" method="post">
        <!--
            A CSRF token helps protect a form from Cross-Site Request Forgery
            by verifying that the request came from the expected user/session.
        -->
        <input type="hidden" name="csrf_token" value="dummy12345">

        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>

        <input type="submit" value="Login">
    </form>
</body>
</html>
