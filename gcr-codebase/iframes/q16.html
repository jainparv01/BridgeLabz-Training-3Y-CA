<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>
    <h2>URI Encoding Example</h2>

    <!-- Spaces in the query are encoded using %20 -->
    <a href="https://example.com/search?query=HTML%20&amp;%20CSS">
        Search for HTML &amp; CSS
    </a>

    <p>
        Encoded URL:
        https://example.com/search?query=HTML%20&amp;%20CSS
    </p>
</body>
</html>
