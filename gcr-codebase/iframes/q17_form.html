<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form with Iframe Result</title>
</head>
<body>
    <h2>Submit Form</h2>

    <form action="result.html" method="get" target="resultFrame">
        <label for="name">Enter Text:</label>
        <input type="text" id="name" name="text">
        <input type="submit" value="Submit">
    </form>

    <br>

    <iframe
        name="resultFrame"
        title="Form Result"
        width="500"
        height="200">
    </iframe>
</body>
</html>
