<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h2>Google Map - Mathura</h2>

    <!-- loading="lazy" delays loading the map until it is near the visible area of the page. -->
    <iframe
        src="https://www.google.com/maps?q=Mathura,India&output=embed"
        title="Map of Mathura"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
