<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security Attributes</title>
</head>
<body>
    <h2>Secure Form Example</h2>

    <form action="#" method="post" autocomplete="off">
        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required>
        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required>
        <br><br>

        <input type="submit" value="Submit">
    </form>

    <p>
        Turning off autocomplete can improve security on shared computers
        because the browser is discouraged from automatically storing or
        filling previously entered form values.
    </p>
</body>
</html>
